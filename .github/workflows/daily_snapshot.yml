name: Daily snapshot

on:
  schedule:
    - cron: "0 13 * * *"   # every day at 13:00 UTC
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write           # least privilege: only what's needed to commit the new data

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run pipeline
        run: python pipeline.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          git push
