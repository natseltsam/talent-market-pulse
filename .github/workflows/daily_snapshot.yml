name: Daily snapshot

on:
  schedule:
    - cron: "0 13 * * *"   # every day at 13:00 UTC
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:                # least privilege: only what this job needs
  contents: write           # commit the new data
  issues: write             # open, update, and close alert issues

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run pipeline
        run: python pipeline.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          git push

      # Runs after the commit, so data is saved even if GitHub's issue API has a problem
      - name: Sync alerts to GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # temporary token GitHub creates for this run only
        run: python alerts.py
